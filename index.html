<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pill Tracker</title>
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pills">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1>Pills</h1>
  <div class="actions">
    <button id="addBtn" class="icon-btn" aria-label="Add pill">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="menuBtn" class="icon-btn" aria-label="Backup and settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
    </button>
  </div>
</header>

<main>
  <p id="banner" class="banner" hidden></p>
  <ul id="pillList" class="pill-list"></ul>
  <div id="empty" class="empty" hidden>
    <p>No pills yet.</p>
    <button id="emptyAddBtn" class="text-btn">Add a pill</button>
  </div>
  <p id="backupStatus" class="footnote"></p>
</main>

<dialog id="pillDialog">
  <form id="pillForm" method="dialog">
    <h2 id="pillDialogTitle">Add pill</h2>
    <label>Name
      <input name="name" required autocomplete="off" maxlength="120">
    </label>
    <label>Instructions <span class="muted">(optional)</span>
      <textarea name="instructions" rows="3" maxlength="1000"></textarea>
    </label>
    <div class="row">
      <button type="button" id="deletePillBtn" class="text-btn danger" hidden>Delete</button>
      <span class="spacer"></span>
      <button type="button" id="cancelPillBtn" class="text-btn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="menuDialog">
  <h2>Data</h2>
  <p class="muted">Everything stays on this device. Export a CSV backup regularly.</p>
  <button id="exportBtn" class="primary wide">Export CSV backup</button>
  <button id="importBtn" class="wide quiet">Import CSV</button>
  <input id="importFile" type="file" accept=".csv,text/csv" hidden>
  <p id="storageStatus" class="muted small"></p>
  <p id="installHint" class="muted small" hidden></p>
  <button id="closeMenuBtn" class="text-btn wide">Done</button>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="app.js" type="module"></script>
</body>
</html>
